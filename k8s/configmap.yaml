apiVersion: v1
kind: ConfigMap
metadata:
  name: analytics-service-config
  namespace: analytics-service
data:
  PORT: "8005"
  AWS_REGION: "us-east-1"
  AWS_SQS_URL: "https://sqs.us-east-1.amazonaws.com/533267294133/analytics-service-dev-queue"
  AWS_DYNAMODB_TABLE: "AnalyticsServiceEventsDev"
  # OpenTelemetry
  OTEL_SERVICE_NAME: "analytics-service"
  OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector.observability.svc.cluster.local:4317"
  DEPLOYMENT_ENVIRONMENT: "dev"
